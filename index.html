<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه من</title>
  <style>
    body { font-family: Tahoma; padding: 15px; background: #f7f7f7; }
    h1 { text-align: center; }
    .product { background:#fff; padding:14px; margin:10px 0;
               border-radius:10px; display:flex;
               justify-content:space-between; }
    .price { color:#27ae60; font-weight:bold; }
  </style>
</head>
<body>
  <h1>🛍 فروشگاه من</h1>
  <div id="products">در حال بارگذاری...</div>

  <script>
    async function load() {
      const res = await fetch('/api/products');
      const products = await res.json();
      document.getElementById('products').innerHTML = products.map(p => `
        <div class="product">
          <span>${p.name}</span>
          <span class="price">${p.price.toLocaleString('fa-IR')} تومان</span>
        </div>
      `).join('');
    }
    load();
  </script>
</body>
</html>
